services:
  - type: web
    name: auto-shop-booking
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auto-shop-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: MAIL_DRIVER
        value: console
      - key: TIMEZONE
        value: Asia/Tokyo

databases:
  - name: auto-shop-db
    plan: free
    region: singapore
